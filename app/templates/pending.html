<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 内联 SVG 图标：不额外落一个文件，也不用再让浏览器为 /favicon.ico 吃一个 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23206bc4'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E7%A4%BE%3C/text%3E%3C/svg%3E">
<title>等待审核 · 社区极简减负智能体平台</title>
<link rel="stylesheet" href="{{ asset('css/login.css') }}">
<style>
  .pend{max-width:520px;margin:0 auto}
  .badge-st{display:inline-flex;align-items:center;gap:7px;padding:6px 14px;border-radius:99px;
    font-size:13px;font-weight:600;background:#fff4e0;color:#a35c00;border:1px solid #f4d9a8}
  .badge-st i{width:7px;height:7px;border-radius:50%;background:#e08b00;display:inline-block;
    animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .kv{display:grid;grid-template-columns:88px 1fr;gap:10px 14px;margin:20px 0 6px;font-size:14px}
  .kv dt{color:#7b8fa7}
  .kv dd{margin:0;color:#12263f;font-weight:600;word-break:break-all}
  .flow{display:flex;align-items:center;gap:8px;margin:22px 0 8px;font-size:12px;color:#8ba0b8}
  .flow b{display:block;font-size:13px;color:#206bc4;margin-bottom:2px}
  .flow .n{flex:1;padding:10px 8px;border-radius:9px;background:#f2f6fc;text-align:center}
  .flow .n.cur{background:#e8f1ff;box-shadow:inset 0 0 0 1.5px #a9c7ec;color:#3a5776}
  .flow .arw{color:#c3d2e4}
  .acts{display:flex;gap:10px;margin-top:18px}
  .acts a,.acts button{flex:1;padding:11px;border-radius:9px;font-size:14px;text-align:center;
    text-decoration:none;cursor:pointer;border:1px solid #d3dded;background:#fff;color:#41556f}
  .acts a:hover,.acts button:hover{border-color:#7fa7e0;color:#206bc4}
  .live{margin-top:14px;font-size:12px;color:#8ba0b8;text-align:center}
</style>
</head>
<body>
<div class="wrap" style="justify-content:center">
  <section class="form-side" style="flex:1">
    <div class="form-card pend">
      <span class="badge-st"><i></i>待管理员审核</span>
      <h2 style="margin:14px 0 6px">申请已提交</h2>
      <p class="hint">管理员核对身份后会为您勾选岗位所需权限，开通后本页会<strong>自动进入系统</strong>，不需要重新登录。</p>

      <dl class="kv">
        <dt>登录账号</dt><dd>{{ u.username }}</dd>
        <dt>姓名</dt><dd>{{ u.name }}</dd>
        <dt>所属单位</dt><dd>{{ u.org }}</dd>
        <dt>申请角色</dt><dd>{{ role_name(u.role) }}</dd>
        <dt>提交时间</dt><dd>{{ u.created_at.strftime('%Y-%m-%d %H:%M') if u.created_at else '-' }}</dd>
      </dl>

      <div class="flow">
        <div class="n"><b>① 已提交</b>信息已入库</div>
        <span class="arw">→</span>
        <div class="n cur"><b>② 审核中</b>等管理员处理</div>
        <span class="arw">→</span>
        <div class="n"><b>③ 已开通</b>按岗授权</div>
      </div>

      <div class="acts">
        <a href="{{ url_for('portalviews.home') }}">先看看居民端</a>
        <form method="post" action="{{ url_for('views.logout') }}" style="flex:1">
          <button type="submit" style="width:100%">退出登录</button>
        </form>
      </div>

      <div class="live" id="live">正在等待审核结果…（本页每 10 秒自查一次）</div>
    </div>
  </section>
</div>

<script>
var HOME = "{{ url_for(ROLE_HOME.get(u.role, 'views.index')) }}";
var tries = 0;

async function poll() {
  try {
    var r = await fetch('/api/admin/me', {cache: 'no-store'});
    if (r.status === 401) { location.href = '/login'; return; }
    var j = await r.json();
    var d = j.data || {};
    if (d.status === 'active') {
      document.getElementById('live').textContent = '✅ 已通过审核，正在进入系统…';
      location.replace(HOME);
      return;
    }
    if (d.status === 'disabled') {
      document.getElementById('live').textContent = '账号已停用，请联系系统管理员';
      return;
    }
    tries++;
    document.getElementById('live').textContent =
      '正在等待审核结果…（已自查 ' + tries + ' 次，每 10 秒一次）';
  } catch (e) {
    document.getElementById('live').textContent = '网络异常，稍后自动重试…';
  }
}
poll();
setInterval(poll, 10000);
</script>
</body>
</html>
